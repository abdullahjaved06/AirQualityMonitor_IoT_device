
# General
CONFIG_LOG=y
CONFIG_LOG_BUFFER_SIZE=2048
CONFIG_JSON_LIBRARY=y
CONFIG_REBOOT=y

CONFIG_NEWLIB_LIBC=y
CONFIG_NEWLIB_LIBC_FLOAT_PRINTF=y
CONFIG_FPU=y
CONFIG_CBPRINTF_FP_SUPPORT=y

# Heap and stacks
CONFIG_HEAP_MEM_POOL_SIZE=65536
CONFIG_MAIN_STACK_SIZE=25192
# CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=4096

# LTE link controller
CONFIG_LTE_LINK_CONTROL=y
CONFIG_LTE_LC_PSM_MODULE=y
CONFIG_LTE_LC_EDRX_MODULE=y

# AT commands interface
# CONFIG_AT_HOST_LIBRARY=y
# CONFIG_UART_INTERRUPT_DRIVEN=y

CONFIG_CJSON_LIB=y
CONFIG_NEWLIB_LIBC=y
CONFIG_NEWLIB_LIBC_FLOAT_PRINTF=y

# Network
CONFIG_NETWORKING=y
CONFIG_NET_NATIVE=y
CONFIG_NET_IPV4=y
CONFIG_NET_CONNECTION_MANAGER=y

# AWS IoT library
CONFIG_AWS_IOT=y
CONFIG_AWS_IOT_APP_VERSION="v1.0.0"
# CONFIG_AWS_IOT_CLIENT_ID_STATIC="359746167121867"
CONFIG_AWS_IOT_BROKER_HOST_NAME="a1pex7b5gbosrz-ats.iot.us-east-1.amazonaws.com"
CONFIG_AWS_IOT_TOPIC_UPDATE_DELTA_SUBSCRIBE=y
CONFIG_AWS_IOT_TOPIC_GET_ACCEPTED_SUBSCRIBE=y
CONFIG_AWS_IOT_TOPIC_GET_REJECTED_SUBSCRIBE=y
CONFIG_AWS_IOT_DEVICE_ID_USE_HW_ID=y
CONFIG_AWS_FOTA_DOWNLOAD_SECURITY_TAG=30

# MQTT helper library
CONFIG_MQTT_HELPER=y
CONFIG_MQTT_HELPER_SEC_TAG=30
CONFIG_MQTT_HELPER_LAST_WILL=y
CONFIG_MQTT_HELPER_STACK_SIZE=4096
CONFIG_MQTT_HELPER_LOG_LEVEL_OFF=y

# MQTT - Maximum MQTT keepalive timeout specified by AWS IoT Core
CONFIG_MQTT_KEEPALIVE=1200
CONFIG_MQTT_CLEAN_SESSION=y

CONFIG_HW_ID_LIBRARY=y
CONFIG_HW_ID_LIBRARY_SOURCE_IMEI=y

# One of the below should be n
CONFIG_AWS_IOT_USE_EDRX=y
CONFIG_AWS_IOT_USE_LTE_POWER_OFF=n

# CONFIG_AWS_IOT_LOG_LEVEL_DBG=y
# CONFIG_AWS_FOTA_LOG_LEVEL_DBG=y



# POWER MANAGEMENT

CONFIG_PM_DEVICE=n
CONFIG_POWEROFF=n




CONFIG_AT_HOST_LIBRARY=n

CONFIG_GPIO=y



CONFIG_LOG=y
CONFIG_LOG_DEFAULT_LEVEL=3
CONFIG_LOG_MODE_IMMEDIATE=y
CONFIG_LOG_BACKEND_UART=n
CONFIG_LOG_BACKEND_RTT=y




# Enable SEGGER RTT as log backend
CONFIG_USE_SEGGER_RTT=y
CONFIG_LOG_BACKEND_RTT=y

# RTT Configuration - blocking mode ensures logs aren't dropped
CONFIG_LOG_BACKEND_RTT_MODE_BLOCK=y
CONFIG_SEGGER_RTT_BUFFER_SIZE_UP=4096

# Disable UART console/logging (using RTT instead)
CONFIG_CONSOLE=n
CONFIG_UART_CONSOLE=n
CONFIG_LOG_BACKEND_UART=n




CONFIG_AWS_IOT_JSON_MESSAGE_SIZE_MAX=1024

CONFIG_REGULATOR=y
CONFIG_I2C_SHELL=y
CONFIG_FUEL_GAUGE=y
CONFIG_NRF_FUEL_GAUGE=y
CONFIG_NRF_FUEL_GAUGE_VARIANT_SECONDARY_CELL=y
CONFIG_REQUIRES_FLOAT_PRINTF=y
# CONFIG_MAIN_STACK_SIZE=1536


#ec generated settings to enable SEGGER RTT logging backend
CONFIG_SENSOR=y
CONFIG_I2C=y
CONFIG_SHT4X=y
CONFIG_SCD4X=y

# Enable the dedicated nPM1300 driver-SEE NRF github npm1300 one button repo
# CONFIG_PMIC_NPM1300=y
CONFIG_SHELL=y
CONFIG_LOG=y
CONFIG_LED=y
CONFIG_GPIO=y
CONFIG_REGULATOR=y
CONFIG_SENSOR=y
CONFIG_I2C_SHELL=y
CONFIG_LOG_CMDS=y


# nRF modem library
CONFIG_NRF_MODEM_LIB=y

# Modem key management (certificates in modem)
CONFIG_MODEM_KEY_MGMT=y


CONFIG_DOWNLOADER_STACK_SIZE=8192

# Downloader stack size (default is often 2048, not enough for TLS + FOTA)
CONFIG_DOWNLOADER_STACK_SIZE=4096

CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=8192

# SPI for display
CONFIG_SPI=y
CONFIG_SPI_NRFX=y
CONFIG_SPI_NRFX_RAM_BUFFER_SIZE=4096

# Display driver
CONFIG_DISPLAY=y
CONFIG_DISPLAY_LOG_LEVEL_DBG=y
CONFIG_SSD16XX=y

# Silence TFM logs
CONFIG_TFM_LOG_LEVEL_SILENCE=y

CONFIG_NRFX_SPIM1=y