# POWER MANAGEMENT

CONFIG_PM_DEVICE=y
CONFIG_POWEROFF=y

# Enable UART driver
CONFIG_SERIAL=y

# Enable console
CONFIG_CONSOLE=y

CONFIG_AT_HOST_LIBRARY=n

CONFIG_POSIX_API=n


CONFIG_SENSOR=y
CONFIG_I2C=y
CONFIG_SHT4X=y
CONFIG_SCD4X=y

CONFIG_CBPRINTF_FP_SUPPORT=y


